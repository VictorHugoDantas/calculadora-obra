<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Obra</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #F7F4EE;
    --surface: #FFFFFF;
    --border: #D9D3C7;
    --text: #1A1714;
    --muted: #6B6560;
    --accent: #B85C2A;
    --accent-light: #F2E8E1;
    --success: #2A7A3B;
    --success-light: #E6F4E9;
    --error: #C0392B;
    --error-light: #FDECEA;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.6rem;
    font-weight: 400;
    letter-spacing: -0.5px;
    color: var(--text);
    line-height: 1.1;
  }

  header p {
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 36px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .field {
    margin-bottom: 22px;
  }

  label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background: var(--bg);
    transition: border-color 0.2s;
    outline: none;
  }

  input:focus { border-color: var(--accent); background: #fff; }
  input.error { border-color: var(--error); }

  .error-msg {
    font-size: 0.8rem;
    color: var(--error);
    margin-top: 5px;
    display: none;
  }

  .error-msg.show { display: block; }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 28px 0;
  }

  .result-box {
    background: var(--accent-light);
    border: 1.5px solid #DDB89A;
    border-radius: 10px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .result-box span { font-size: 0.85rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .result-box strong { font-family: 'DM Serif Display', serif; font-size: 1.8rem; color: var(--accent); }

  button.btn-calc {
    width: 100%;
    padding: 14px;
    background: var(--text);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-bottom: 12px;
  }

  button.btn-calc:hover { background: #2e2a26; }
  button.btn-calc:active { transform: scale(0.98); }

  button.btn-save {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  button.btn-save:hover { background: #9e4d22; }
  button.btn-save:active { transform: scale(0.98); }

  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    padding: 14px 24px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 100;
    white-space: nowrap;
  }

  .toast.success { background: var(--success-light); color: var(--success); border: 1.5px solid #b2d9b9; }
  .toast.err { background: var(--error-light); color: var(--error); border: 1.5px solid #f5b7b1; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* DB TABLE */
  .db-section {
    width: 100%;
    max-width: 760px;
    margin-top: 48px;
  }

  .db-section h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    font-weight: 400;
    margin-bottom: 16px;
    color: var(--text);
  }

  .db-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .db-count {
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 500;
  }

  button.btn-clear {
    font-size: 0.8rem;
    color: var(--error);
    background: none;
    border: 1px solid var(--error);
    border-radius: 6px;
    padding: 4px 12px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 0.9rem;
  }

  thead { background: var(--text); color: #fff; }
  thead th { padding: 12px 16px; text-align: left; font-weight: 600; font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase; }
  tbody tr { border-top: 1px solid var(--border); }
  tbody tr:nth-child(even) { background: var(--bg); }
  tbody td { padding: 12px 16px; color: var(--text); }
  tbody td.money { font-family: 'DM Serif Display', serif; font-size: 1rem; }
  tbody td.total { color: var(--accent); font-weight: 700; }

  .empty-state {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 0.9rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
</style>
</head>
<body>

<header>
  <h1>Calculadora de Obra</h1>
  <p>Registro de orçamentos de construção</p>
</header>

<div class="card">
  <div class="field">
    <label for="nomeCliente">Nome do Cliente</label>
    <input type="text" id="nomeCliente" placeholder="Ex: João Silva" autocomplete="off">
    <div class="error-msg" id="erroNome">Somente letras e espaços são permitidos.</div>
  </div>

  <div class="field">
    <label for="valorMaterial">Valor do Material (R$)</label>
    <input type="text" id="valorMaterial" placeholder="0,00" autocomplete="off">
    <div class="error-msg" id="erroMaterial">Informe um valor numérico válido.</div>
  </div>

  <div class="field">
    <label for="valorMaoDeObra">Valor da Mão de Obra (R$)</label>
    <input type="text" id="valorMaoDeObra" placeholder="0,00" autocomplete="off">
    <div class="error-msg" id="erroMaoDeObra">Informe um valor numérico válido.</div>
  </div>

  <hr class="divider">

  <div class="result-box">
    <span>Total Calculado</span>
    <strong id="resultadoTotal">R$ 0,00</strong>
  </div>

  <button class="btn-calc" onclick="calcular()">Calcular Total</button>
  <button class="btn-save" onclick="salvar()">Gravar Orçamento</button>
</div>

<div class="db-section">
  <div class="db-header">
    <h2>Banco de Dados — Orçamentos</h2>
    <div style="display:flex;gap:8px;align-items:center;">
      <span class="db-count" id="dbCount">0 registros</span>
      <button class="btn-clear" onclick="limparBanco()">Limpar tudo</button>
    </div>
  </div>
  <div id="tabelaContainer"><div class="empty-state">Nenhum orçamento gravado ainda.</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── IndexedDB setup ──────────────────────────────────────────────
  const DB_NAME = 'CalcObraDB';
  const STORE   = 'orcamentos';
  let db;

  function abrirDB() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains(STORE)) {
          const store = d.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
          store.createIndex('cliente', 'cliente', { unique: false });
        }
      };
      req.onsuccess = e => { db = e.target.result; res(db); };
      req.onerror   = e => rej(e.target.error);
    });
  }

  function inserirRegistro(registro) {
    return new Promise((res, rej) => {
      const tx    = db.transaction(STORE, 'readwrite');
      const store = tx.objectStore(STORE);
      const req   = store.add(registro);
      req.onsuccess = () => res(req.result);
      req.onerror   = e => rej(e.target.error);
    });
  }

  function listarRegistros() {
    return new Promise((res, rej) => {
      const tx    = db.transaction(STORE, 'readonly');
      const store = tx.objectStore(STORE);
      const req   = store.getAll();
      req.onsuccess = () => res(req.result);
      req.onerror   = e => rej(e.target.error);
    });
  }

  function limparStore() {
    return new Promise((res, rej) => {
      const tx    = db.transaction(STORE, 'readwrite');
      const store = tx.objectStore(STORE);
      const req   = store.clear();
      req.onsuccess = () => res();
      req.onerror   = e => rej(e.target.error);
    });
  }

  // ── Helpers ──────────────────────────────────────────────────────
  function parseMoeda(str) {
    return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0;
  }

  function formatMoeda(val) {
    return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function showToast(msg, tipo = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + tipo + ' show';
    setTimeout(() => { t.className = 'toast ' + tipo; }, 3000);
  }

  // ── Mascaras ─────────────────────────────────────────────────────
  function mascaraMoeda(input) {
    let v = input.value.replace(/\D/g, '');
    v = (parseInt(v || '0') / 100).toFixed(2);
    input.value = v.replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  document.getElementById('valorMaterial').addEventListener('input',   e => mascaraMoeda(e.target));
  document.getElementById('valorMaoDeObra').addEventListener('input',  e => mascaraMoeda(e.target));

  document.getElementById('nomeCliente').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^a-zA-ZÀ-ÿ\s]/g, '');
  });

  // ── Validação ────────────────────────────────────────────────────
  function validar() {
    let ok = true;
    const nome = document.getElementById('nomeCliente').value.trim();
    const mat  = document.getElementById('valorMaterial').value.trim();
    const mao  = document.getElementById('valorMaoDeObra').value.trim();

    const erroNome = document.getElementById('erroNome');
    const erroMat  = document.getElementById('erroMaterial');
    const erroMao  = document.getElementById('erroMaoDeObra');
    const inpNome  = document.getElementById('nomeCliente');
    const inpMat   = document.getElementById('valorMaterial');
    const inpMao   = document.getElementById('valorMaoDeObra');

    if (!nome || !/^[a-zA-ZÀ-ÿ\s]+$/.test(nome)) {
      erroNome.classList.add('show'); inpNome.classList.add('error'); ok = false;
    } else { erroNome.classList.remove('show'); inpNome.classList.remove('error'); }

    if (!mat || parseMoeda(mat) < 0) {
      erroMat.classList.add('show'); inpMat.classList.add('error'); ok = false;
    } else { erroMat.classList.remove('show'); inpMat.classList.remove('error'); }

    if (!mao || parseMoeda(mao) < 0) {
      erroMao.classList.add('show'); inpMao.classList.add('error'); ok = false;
    } else { erroMao.classList.remove('show'); inpMao.classList.remove('error'); }

    return ok;
  }

  // ── Calcular ─────────────────────────────────────────────────────
  function calcular() {
    const mat = parseMoeda(document.getElementById('valorMaterial').value  || '0');
    const mao = parseMoeda(document.getElementById('valorMaoDeObra').value || '0');
    document.getElementById('resultadoTotal').textContent = formatMoeda(mat + mao);
  }

  // ── Salvar ───────────────────────────────────────────────────────
  async function salvar() {
    if (!validar()) return;

    calcular();

    const mat  = parseMoeda(document.getElementById('valorMaterial').value);
    const mao  = parseMoeda(document.getElementById('valorMaoDeObra').value);

    const registro = {
      cliente:      document.getElementById('nomeCliente').value.trim(),
      material:     mat,
      maoDeObra:    mao,
      total:        mat + mao,
      dataHora:     new Date().toLocaleString('pt-BR')
    };

    try {
      await inserirRegistro(registro);
      showToast('✓ Sucesso ao gravar o orçamento!', 'success');
      document.getElementById('nomeCliente').value  = '';
      document.getElementById('valorMaterial').value = '';
      document.getElementById('valorMaoDeObra').value = '';
      document.getElementById('resultadoTotal').textContent = 'R$ 0,00';
      await renderTabela();
    } catch (err) {
      showToast('Erro ao gravar no banco.', 'err');
      console.error(err);
    }
  }

  // ── Limpar banco ─────────────────────────────────────────────────
  async function limparBanco() {
    if (!confirm('Deseja apagar todos os registros?')) return;
    await limparStore();
    await renderTabela();
    showToast('Banco de dados limpo.', 'err');
  }

  // ── Renderizar tabela ─────────────────────────────────────────────
  async function renderTabela() {
    const registros = await listarRegistros();
    const cont = document.getElementById('tabelaContainer');
    document.getElementById('dbCount').textContent = registros.length + ' registro' + (registros.length !== 1 ? 's' : '');

    if (registros.length === 0) {
      cont.innerHTML = '<div class="empty-state">Nenhum orçamento gravado ainda.</div>';
      return;
    }

    const rows = registros.map(r => `
      <tr>
        <td>${r.id}</td>
        <td>${r.cliente}</td>
        <td class="money">${formatMoeda(r.material)}</td>
        <td class="money">${formatMoeda(r.maoDeObra)}</td>
        <td class="money total">${formatMoeda(r.total)}</td>
        <td style="color:var(--muted);font-size:0.82rem">${r.dataHora}</td>
      </tr>
    `).join('');

    cont.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>#ID</th>
            <th>Cliente</th>
            <th>Material</th>
            <th>Mão de Obra</th>
            <th>Total</th>
            <th>Data / Hora</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  // ── Init ──────────────────────────────────────────────────────────
  abrirDB().then(renderTabela);
</script>
</body>
</html>
